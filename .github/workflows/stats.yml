name: stats

# Regenerates assets/stats-*.svg into this repo.
#
# The point is that the README depends on a file we own, not on a shared
# third-party card service. Those rate-limit and go down, and when they do your
# profile shows a red ERROR box to whoever is reading it.

on:
  schedule:
    - cron: "17 3 * * *"      # daily, 03:17 UTC
  workflow_dispatch:           # run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render stat cards
        env:
          # STATS_TOKEN is optional. The default GITHUB_TOKEN can't always read
          # contributionsCollection; without it the card still renders, just
          # without the contribution heatmap. To get the heatmap, add a classic
          # PAT with `read:user` scope as a secret named STATS_TOKEN.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
